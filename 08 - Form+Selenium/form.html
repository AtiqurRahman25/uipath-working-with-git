
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOVA - Get Started</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

body {
    min-height: 100vh;
    background: #080d19;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 15px;
}

/* BACKGROUND */

.glow {
    position: fixed;
    width: 400px;
    height: 400px;
    background: #6555ff;
    filter: blur(160px);
    opacity: .2;
    z-index: -1;
}

/* FORM CONTAINER */

.container {
    width: 100%;
    max-width: 500px;
    background: #111b30;
    border: 1px solid #263451;
    padding: 40px;
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
}

.logo {
    text-align: center;
    color: #8b9cff;
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 25px;
}

h2 {
    text-align: center;
    font-size: 28px;
    margin-bottom: 12px;
}

.subtitle {
    text-align: center;
    color: #98a5bc;
    font-size: 14px;
    margin-bottom: 30px;
    line-height: 1.7;
}

/* INPUTS */

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 9px;
    font-size: 14px;
    font-weight: 600;
}

input, select, textarea {
    width: 100%;
    padding: 14px;
    background: #080d19;
    border: 1px solid #293752;
    border-radius: 8px;
    outline: none;
    color: white;
    font-size: 14px;
    transition: .3s;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #7165f5;
    box-shadow: 0 0 0 3px rgba(113,101,245,.12);
}

select option {
    background: #111b30;
}

textarea {
    resize: vertical;
    min-height: 100px;
}

/* BUTTON */

button {
    width: 100%;
    padding: 15px;
    background: #7165f5;
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: .3s;
}

button:hover {
    background: #8b80ff;
    transform: translateY(-2px);
}

/* FOOTER */

.back {
    text-align: center;
    margin-top: 25px;
}

.back a {
    color: #9c96ff;
    text-decoration: none;
    font-size: 13px;
}

.back a:hover {
    text-decoration: underline;
}

/* MOBILE */

@media(max-width: 500px) {
    .container {
        padding: 28px 20px;
    }
}

</style>
</head>

<body>

<div class="glow"></div>

<div class="container">

    <div class="logo">✦ NOVA</div>

    <h2>Start Your Journey</h2>

    <p class="subtitle">
        Tell us a little about yourself.
        Let's make your workflow smarter with automation.
    </p>

    <form action="/submit" method="POST">

        <div class="form-group">
            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >
        </div>

        <div class="form-group">
            <label for="service">What do you need?</label>

            <select id="service" name="service" required>
                <option value="">Select a service</option>
                <option value="Email Automation">Email Automation</option>
                <option value="AI Assistant">AI Assistant</option>
                <option value="Web Automation">Web Automation</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label for="message">Additional Information</label>

            <textarea
                id="message"
                name="message"
                placeholder="Tell us about your requirements..."
            ></textarea>
        </div>

        <button type="submit">
            Submit Request →
        </button>

    </form>

    <div class="back">
        <a href="index.html">← Back to Home</a>
    </div>

</div>

</body>
</html>
